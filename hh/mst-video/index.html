	<style>

		.visually-hidden:not(:focus):not(:active),
		input[type="checkbox"].visually-hidden,
		input[type="radio"].visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			margin: -1px;
			bottom: 0;
			padding: 0;
			white-space: nowrap;
			-webkit-clip-path: inset(100%);
			clip-path: inset(100%);
			clip: rect(0 0 0 0);
			overflow: hidden;
		}
		.wrapper {			
			position: relative;
			width: 80%;
		}

		.text {
			position: absolute;
			top: 0;
			left: 0;
			bottom: 0;
			right: 0;			
			margin: 0;

			display: flex;
			flex-wrap: wrap;

			font-size: 75px;
/*			line-height: 75px;*/
/*			line-height: 36px;*/			
			color: #fafafa;

			white-space: pre;
		}

		.text span {
			margin: 0;
			background-color: green;
/*			background-color: #050505;*/
			word-wrap: break-word;
		}

		.text .opacity {
			flex-grow: 2;			
			display: inline-block;
			/*width: 300px;
			max-width: 500px;*/
/*			margin: 2px 0;*/
/*			height: 10px;*/
			font-size: 50px;
/*			background-color: transparent;*/
			background-color: red;
/*			box-shadow: 0 0 1000px #000;*/			
		}

		.video {
			width: 100%;
		}
	</style>
</head>
